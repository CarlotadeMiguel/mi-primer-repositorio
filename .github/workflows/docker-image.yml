name: Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/reactrepository:${{ GITHUB_SHA:0:7 }}

      - name: Echo message
        run: |
          echo "${GITHUB_SHA}"
          echo "Este es un mensaje desde GitHub Actions"
          echo "El repositorio es: ${{ github.repository }}"
          echo "El evento que disparó este flujo es: ${{ github.event_name }}"
